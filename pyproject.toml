[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-fabric"
version = "0.1.1"
description = "Vendor-neutral intent planning and approval framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Intent Fabric Contributors" }]
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
]

[project.scripts]
intent-fabric-mcp = "intent_fabric.mcp.server:run_mcp_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=intent_fabric --cov-report=term-missing --cov-fail-under=90"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W292", "W293"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]

