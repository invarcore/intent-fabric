name: ETUDE Tool Lockfile Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-tool-lock:
    name: Verify Agent Tools Lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify CLI lockfile regression tests & project lockfile (if present)
        run: |
          uv run pytest tests/test_cli_lock_workflow.py -q
          if [ -f "agent-tools.lock" ]; then
            uv run intent-fabric lock check src --lockfile agent-tools.lock
          else
            echo "::notice ::No agent-tools.lock present at repo root; verified CLI lock workflow suite."
          fi
